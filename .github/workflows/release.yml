name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_suffix: linux-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_suffix: macos-arm64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_suffix: macos-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_suffix: windows-x86_64.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Resolve binary and asset names
        id: meta
        shell: bash
        run: |
          BIN_NAME=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].targets[] | select(.kind[] == "bin") | .name' | head -n 1)
          if [ -z "$BIN_NAME" ]; then
            echo "::error::Could not determine binary name from Cargo.toml"
            exit 1
          fi
          echo "bin_name=$BIN_NAME" >> "$GITHUB_OUTPUT"
          echo "asset_name=${BIN_NAME}-${{ matrix.asset_suffix }}" >> "$GITHUB_OUTPUT"

      - name: Build binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../${{ steps.meta.outputs.asset_name }} ${{ steps.meta.outputs.bin_name }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path "${{ steps.meta.outputs.bin_name }}.exe" -DestinationPath "../../../${{ steps.meta.outputs.asset_name }}"

      - name: Upload Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.meta.outputs.asset_name }}
          path: ${{ steps.meta.outputs.asset_name }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify the pushed tag
        env:
          TAG: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$TAG' is not a vMAJOR.MINOR.PATCH tag."
            exit 1
          fi

          tag_object_type=$(git cat-file -t "$TAG")
          if [ "$tag_object_type" != "tag" ]; then
            echo "::error::'$TAG' is a $tag_object_type, not an annotated tag. Create it with 'git tag -a', or via scripts/release.py --tag."
            exit 1
          fi

          cargo_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$TAG" != "v$cargo_version" ]; then
            echo "::error::'$TAG' does not match the Cargo.toml version ($cargo_version). Bump the version in Cargo.toml and Cargo.lock before tagging."
            exit 1
          fi

          tagged_sha=$(git rev-list -n 1 "$TAG")
          if [ "$tagged_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::'$TAG' points at $tagged_sha but this run checked out $EXPECTED_SHA."
            exit 1
          fi

          echo "✓ $TAG is an annotated tag at $tagged_sha."

      - name: Extract release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/release.py --extract-notes "$TAG" > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no notes for $TAG. A tag without release notes is an unchecked gap."
            exit 1
          fi

          {
            echo "### Release notes for $TAG"
            echo ""
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          path: assets

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; updating notes and assets."
            gh release edit "$TAG" --notes-file release-notes.md
            gh release upload "$TAG" assets/* --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file release-notes.md \
              --verify-tag \
              assets/*
          fi